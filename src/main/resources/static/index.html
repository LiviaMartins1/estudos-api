
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpace - Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec, #e8eaf6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #d45d91;
            font-size: 30px;
        }

        .logo p {
            color: #888;
            margin-top: 8px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #d45d91;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #d45d91;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #bd477b;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .login a {
            color: #d45d91;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>


<body>

<div class="container">

    <div class="logo">
        <h1>StudySpace 📚</h1>
        <p>Organize seus estudos e alcance seus objetivos!</p>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="formCadastro">

        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Crie uma senha" required>
        </div>

        <div class="form-group">
            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar" name="confirmar"
                   placeholder="Confirme sua senha" required>
        </div>

        <div class="form-group">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="form-group">
            <label for="escolaridade">Nível de escolaridade</label>
            <select id="escolaridade" name="escolaridade" required>
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="ENSINO_FUNDAMENTAL">Ensino Fundamental</option>
                <option value="ENSINO_MEDIO">Ensino Médio</option>
                <option value="ENSINO_TECNICO">Ensino Técnico</option>
                <option value="ENSINO_SUPERIOR">Ensino Superior</option>
            </select>
        </div>

        <button type="submit">Criar minha conta</button>

    </form>

    <!-- TELA DE CADASTRO REALIZADO -->
    <div id="confirmacao" style="display: none;">

        <h2 style="color: #d45d91; text-align: center;">
            🎉 Cadastro realizado!
        </h2>

        <p style="text-align: center; margin: 12px 0 25px; color: #888;">
            Sua conta no StudySpace foi criada com sucesso!
        </p>

        <h3 style="margin-bottom: 15px;">Seus dados cadastrados:</h3>

        <div class="form-group">
            <label>Nome completo</label>
            <p id="dadosNome"></p>
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <p id="dadosEmail"></p>
        </div>

        <div class="form-group">
            <label>Data de nascimento</label>
            <p id="dadosNascimento"></p>
        </div>

        <div class="form-group">
            <label>Escolaridade</label>
            <p id="dadosEscolaridade"></p>
        </div>

        <button type="button" onclick="voltarCadastro()">
            Voltar
        </button>

    </div>

    <div class="login" id="loginLink">
        Já possui uma conta?
        <a href="login.html">Fazer login</a>
    </div>

</div>

<script>

    document.getElementById("formCadastro").addEventListener("submit", async function(event) {

        event.preventDefault();

        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar").value;

        if (senha !== confirmar) {
            alert("As senhas não coincidem!");
            return;
        }

        const aluno = {
            nome: document.getElementById("nome").value,
            email: document.getElementById("email").value,
            senha: senha,
            dataNascimento: document.getElementById("nascimento").value,
            escolaridade: document.getElementById("escolaridade").value
        };

        try {

            const resposta = await fetch("/api/estudos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(aluno)
            });

            if (resposta.ok) {

                document.getElementById("dadosNome").textContent = aluno.nome;
                document.getElementById("dadosEmail").textContent = aluno.email;

                const data = aluno.dataNascimento.split("-");
                document.getElementById("dadosNascimento").textContent =
                    `${data[2]}/${data[1]}/${data[0]}`;

                const escolaridades = {
                    ENSINO_FUNDAMENTAL: "Ensino Fundamental",
                    ENSINO_MEDIO: "Ensino Médio",
                    ENSINO_TECNICO: "Ensino Técnico",
                    ENSINO_SUPERIOR: "Ensino Superior"
                };

                document.getElementById("dadosEscolaridade").textContent =
                    escolaridades[aluno.escolaridade];

                document.getElementById("formCadastro").style.display = "none";
                document.getElementById("confirmacao").style.display = "block";
                document.getElementById("loginLink").style.display = "none";

            } else {
                alert("Erro ao realizar cadastro!");
                console.log(await resposta.text());
            }

        } catch (erro) {
            alert("Erro de conexão com o servidor!");
            console.error(erro);
        }

    });

    function voltarCadastro() {

        document.getElementById("formCadastro").reset();

        document.getElementById("formCadastro").style.display = "block";
        document.getElementById("confirmacao").style.display = "none";
        document.getElementById("loginLink").style.display = "block";

    }

</script>

</body>
</html>
